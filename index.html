<html class="has-navbar-fixed-top has-background-primary-10">
    <head>
        <title>Arlet's Creations</title>
        <link rel="stylesheet"  href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
        <link rel="stylesheet"  href="css/style.css">
    </head>
    <body class="is-size-5">
        <nav class="navbar has-background-primary-10 is-fixed-top mb-auto drop-shadow">
                <div class="media p-5 columns">
                    <div class="column is-one-third-desktop is-one-third-tablet is-one-third-mobile">
                        <figure class="image"><img src="images/title.webp" alt="Placeholder image" /> </figure>
                    </div>
                    <div class="column has-text-right mt-auto">
                        <h1 class="title">Arlet's Avatar Catalog</h1>
                        <p class="subtitle">Some of my favorite creations</p>
                        <a class="subtitle has-text-weight-bold has-text-white " href="https://www.roblox.com/communities/34938712/Arlets-Monopoly#!/about" style="text-decoration: underline;">Join the community</a>
                    </div>
                </div>
        </nav>
        <div class="columns is-mobile">
            <div class="column is-two-thirds-desktop is-half-mobile ml-6">
                <div class="card has-background-primary-15 fixed-grid has-3-cols-desktop has-1-cols-mobile p-4">
                    <div class="grid" id="Grid">
                        <!-- Content goes here -->  
                        <div class="card cell has-background-primary-10 p-auto" style="min-height: 606px">
                            <div class="card-image is-flex is-justify-content-center is-align-items-center" style="min-height: 100%;">
                                <a id="addToCatalog"><figure class="image invert"><img src="images/add-circle-outline.svg" alt="Placeholder image" style="width: 100px;"></figure></a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="column" style="position: fixed; top: 12.5rem; right: 10; width: 30%;">
                <div class="card has-background-primary-15 mr-5" id="searchBox">
                    <div class="card-content">
                        <input class="input is-rounded has-background-primary-10" type="text" placeholder="Search" id="searchInput"/>
                    </div>
                    <footer class="card-footer p-4">
                        <a class="card-footer-item icon my-auto" id="saveCatalog"><figure class="image mr-4 invert"><img src="images/save-outline.svg" alt="Placeholder image" style="width: 32px;"></figure>Save</a>
                        <a class="card-footer-item icon my-auto" id="loadCatalog"><figure class="image mr-4 invert"><img src="images/cloud-upload-outline.svg" alt="Placeholder image" style="width: 32px;"></figure>Load</a>
                        <a class="card-footer-item icon my-auto" id="resetCatalog"><figure class="image mr-4 invert"><img src="images/refresh-outline.svg" alt="Placeholder image" style="width: 32px;"></figure>Reset</a>
                    </footer>
                </div>
                <div class="card has-background-primary-15 p-5 mt-3 mr-5" id="descriptionBox" style="height: 600px;">
                </div>
            </div>
        </div>
    <script src="js/main.js"></script>
    </body>
</html>
